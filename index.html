<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101d35"><title>Gifthub | Corporate Gifting</title>
<style>
:root{--navy:#101d35;--navy2:#1b2c4a;--ink:#172338;--muted:#768297;--line:#e7eaf0;--bg:#f5f6f8;--white:#fff;--gold:#e7b96c;--green:#21865b;--red:#c65b54;--blue:#4775bd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:var(--navy);color:#dbe3ef;padding:24px 16px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;align-items:center;gap:10px;padding:0 10px;font-size:20px;font-weight:750;color:white;letter-spacing:-.5px}.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--gold);color:#1d2a3e;display:grid;place-items:center;font-weight:900}.rolebox{padding:12px;background:#1d2d49;border:1px solid #344562;border-radius:12px}.rolebox label{display:block;color:#9baac0;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}.rolebox select{width:100%;background:#263957;color:white;border:1px solid #425571;border-radius:8px;padding:9px}.nav-label{padding:0 12px;color:#8798b2;font-size:10px;text-transform:uppercase;letter-spacing:1.3px;margin-bottom:7px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#c3cede;text-align:left;padding:10px 12px;border-radius:9px;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#293c5b;color:#fff}.nav .ico{width:18px;text-align:center;color:#b9c7d9}.side-foot{margin-top:auto;border-top:1px solid #33445f;padding:16px 10px;color:#93a3ba;font-size:12px}.main{min-width:0}.topbar{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.crumb{color:var(--muted);font-size:12px}.topright{display:flex;align-items:center;gap:16px}.tenant{padding:7px 11px;border:1px solid var(--line);border-radius:9px;color:#46546b;font-size:12px}.avatar{width:34px;height:34px;background:#e9edf4;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#31415d}.content{max-width:1440px;margin:auto;padding:30px 34px 56px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#9a805c;font-weight:700}.h1{font-size:27px;letter-spacing:-.8px;margin:3px 0 4px}.sub{color:var(--muted)}.btn{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:9px;color:#33435a;font-weight:600}.btn.primary{background:var(--navy);border-color:var(--navy);color:white}.btn.gold{background:var(--gold);border-color:var(--gold);color:#26334a}.btn.small{font-size:12px;padding:6px 10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 3px 12px #25334a06}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{width:32px;height:32px;border-radius:9px;background:#f4f0e9;display:grid;place-items:center}.stat-num{font-size:27px;font-weight:750;letter-spacing:-.8px;margin:10px 0 2px}.trend{font-size:11px;color:var(--green)}.split{grid-template-columns:1.4fr 1fr}.section-title{font-weight:700;font-size:15px;margin-bottom:4px}.section-sub{font-size:12px;color:var(--muted);margin-bottom:16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#8791a1;font-size:10px;text-transform:uppercase;letter-spacing:.9px;font-weight:650;padding:10px 9px;border-bottom:1px solid var(--line)}td{padding:13px 9px;border-bottom:1px solid #f0f1f4;font-size:12px}tr:last-child td{border-bottom:0}.status{display:inline-flex;align-items:center;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:700;background:#eef5f1;color:var(--green)}.status.pending{background:#fbf4e9;color:#aa762b}.status.ship{background:#edf2fa;color:#4775bd}.status.cancel{background:#f9eeee;color:var(--red)}.product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.product{padding:0;overflow:hidden}.product-art{height:150px;display:grid;place-items:center;font-size:54px;background:linear-gradient(135deg,#f4eee5,#e7eaf0)}.product:nth-child(2) .product-art{background:linear-gradient(135deg,#e6e9f2,#d5dfeb)}.product:nth-child(3) .product-art{background:linear-gradient(135deg,#e9eee6,#dce8d8)}.product:nth-child(4) .product-art{background:linear-gradient(135deg,#f3e7df,#ead7d0)}.product:nth-child(5) .product-art{background:linear-gradient(135deg,#e7e8ef,#d6d7e5)}.product:nth-child(6) .product-art{background:linear-gradient(135deg,#f4efdf,#e9e0c5)}.product-info{padding:14px}.product-name{font-weight:700}.product-meta{color:var(--muted);font-size:11px;margin:3px 0 12px}.price{font-size:17px;font-weight:750}.pill{font-size:10px;background:#f4f5f7;color:#68758a;padding:4px 7px;border-radius:99px}.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}.wallet{background:var(--navy);color:white;border-radius:14px;padding:22px;position:relative;overflow:hidden}.wallet:after{content:"";position:absolute;width:190px;height:190px;border:1px solid #ffffff18;border-radius:50%;right:-60px;top:-100px;box-shadow:0 0 0 24px #ffffff08,0 0 0 48px #ffffff05}.wallet .label{color:#aebbd0;font-size:11px;text-transform:uppercase;letter-spacing:1px}.wallet .amount{font-size:34px;font-weight:750;margin:8px 0}.wallet small{color:#aebbd0}.wallet .btn{position:relative;z-index:1;margin-top:16px}.progress{height:7px;background:#edf0f4;border-radius:20px;overflow:hidden}.progress span{height:100%;display:block;background:var(--gold);border-radius:20px}.empty{padding:36px;text-align:center;color:var(--muted)}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:11px;color:#68758a;font-weight:650}.field input,.field select{width:100%;border:1px solid #dfe3ea;border-radius:8px;padding:10px;background:#fff}.modal-back{position:fixed;inset:0;background:#101d3580;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-back.open{display:flex}.modal{width:min(460px,100%);background:white;border-radius:16px;padding:22px;box-shadow:0 20px 60px #0003}.modal h3{margin:0 0 5px;font-size:19px}.modal p{color:var(--muted);font-size:12px;margin:0 0 18px}.toast{position:fixed;bottom:22px;right:22px;background:#1b2c4a;color:white;padding:12px 16px;border-radius:10px;box-shadow:0 8px 25px #0002;display:none;z-index:20}.toast.show{display:block}.mobile-menu{display:none}
@media(max-width:950px){.shell{grid-template-columns:210px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;z-index:5;left:-260px;top:0;bottom:0;width:248px;transition:left .2s}.sidebar.open{left:0}.mobile-menu{display:inline-block}.topbar{padding:0 16px;height:62px}.content{padding:22px 16px}.tenant{display:none}.heading{display:block}.heading .actions{margin-top:14px}.stats{gap:10px}.card{padding:14px}.stat-num{font-size:23px}.product-grid{grid-template-columns:1fr 1fr}.product-art{height:112px;font-size:42px}.h1{font-size:24px}}
</style></head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="brand-mark">g</span> gifthub</div>
  <div class="rolebox"><label>Viewing experience</label><select id="roleSelect"><option value="superadmin">Superadmin</option><option value="hr">Company HR Admin</option><option value="employee">Employee</option><option value="ops">Operations</option></select></div>
  <div><div class="nav-label">Workspace</div><nav class="nav" id="nav"></nav></div>
  <div class="side-foot">Gifthub Demo Workspace<br><span style="color:#71839e">Multi-tenant gifting platform · Demo mode</span></div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn small mobile-menu" id="menuBtn">☰</button><div><div style="font-weight:700">Workspace</div><div class="crumb" id="breadcrumb">Overview / Dashboard</div></div></div><div class="topright"><span class="tenant" id="tenantLabel">All tenants · Platform view</span><div class="avatar" id="userAvatar">SA</div></div></header>
<div class="content" id="content"></div>
</main></div>
<div class="modal-back" id="modalBack"><div class="modal"><div class="row-between"><h3 id="modalTitle">Action</h3><button class="btn small" id="modalClose">✕</button></div><p id="modalDesc"></p><div id="modalFields"></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn" id="modalCancel">Cancel</button><button class="btn primary" id="modalSave">Confirm</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const products=[
{id:1,name:"Everyday Insulated Bottle",category:"Drinkware",price:899,icon:"◉",desc:"Double-wall stainless steel · 750 ml"},
{id:2,name:"Commuter Backpack",category:"Bags",price:1899,icon:"▣",desc:"Water-resistant · 18L capacity"},
{id:3,name:"Desk Essentials Kit",category:"Office",price:1299,icon:"▤",desc:"Notebook, pen and desk organiser"},
{id:4,name:"Premium Hoodie",category:"Apparel",price:2199,icon:"♧",desc:"Organic cotton · Unisex fit"},
{id:5,name:"Wireless Audio Buds",category:"Electronics",price:2499,icon:"♫",desc:"Clear sound · Charging case"},
{id:6,name:"Wellness Gift Box",category:"Lifestyle",price:1599,icon:"✿",desc:"Curated self-care collection"}
];
let orders=[
{id:"GH-2048",who:"Priya Sharma",tenant:"Acme Technologies",item:"Commuter Backpack",amount:1899,status:"Shipped",date:"04 Nov 2026"},
{id:"GH-2047",who:"Rahul Mehta",tenant:"Acme Technologies",item:"Everyday Insulated Bottle",amount:899,status:"Processing",date:"04 Nov 2026"},
{id:"GH-2046",who:"Ananya Rao",tenant:"Northstar Labs",item:"Wellness Gift Box",amount:1599,status:"Delivered",date:"03 Nov 2026"},
{id:"GH-2045",who:"Dev Malhotra",tenant:"Acme Technologies",item:"Premium Hoodie",amount:2199,status:"Pending",date:"03 Nov 2026"},
{id:"GH-2044",who:"Ishita Kapoor",tenant:"BluePeak Finance",item:"Desk Essentials Kit",amount:1299,status:"Delivered",date:"02 Nov 2026"}
];
let employees=[
{name:"Priya Sharma",email:"priya@acme.io",team:"Engineering",credits:3500,status:"Active"},
{name:"Rahul Mehta",email:"rahul@acme.io",team:"Product",credits:2200,status:"Active"},
{name:"Ananya Rao",email:"ananya@northstar.io",team:"People",credits:5000,status:"Active"},
{name:"Dev Malhotra",email:"dev@acme.io",team:"Sales",credits:1800,status:"Active"},
{name:"Ishita Kapoor",email:"ishita@bluepeak.com",team:"Design",credits:4200,status:"Active"}
];
let tenants=[{name:"Acme Technologies",people:420,credits:"₹18.4L",status:"Active"},{name:"Northstar Labs",people:185,credits:"₹8.2L",status:"Active"},{name:"BluePeak Finance",people:310,credits:"₹12.6L",status:"Active"},{name:"Vertex Consulting",people:96,credits:"₹4.1L",status:"Invited"}];
const menus={
superadmin:[["Overview","▦"],["Tenants","◫"],["Master catalogue","◇"],["All orders","▤"],["Procurement","⇄"],["Reports","▥"],["Settings","⚙"]],
hr:[["Overview","▦"],["Employees","♙"],["Credits & wallets","◉"],["Gift assortment","◇"],["Orders","▤"],["Reports","▥"],["Company settings","⚙"]],
employee:[["Gift store","◇"],["My wallet","◉"],["My orders","▤"],["Delivery addresses","⌖"]],
ops:[["Overview","▦"],["Order queue","▤"],["Procurement","⇄"],["Shipping & delivery","⌖"],["Inventory","▧"]]
};
let role="superadmin",page="Overview",wallet=4200;
const $=s=>document.querySelector(s),money=n=>"₹"+Number(n).toLocaleString("en-IN");
function toast(s){const t=$("#toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
function status(s){let c=s==="Delivered"||s==="Active"?"":s==="Shipped"||s==="Processing"?"ship":s==="Pending"||s==="Invited"?"pending":"cancel";return '<span class="status '+c+'">'+s+'</span>'}
function stat(label,value,icon,foot){return '<div class="card"><div class="stat-top"><span>'+label+'</span><span class="stat-icon">'+icon+'</span></div><div class="stat-num">'+value+'</div><div class="trend">'+foot+'</div></div>'}
function heading(title,sub,action){return '<div class="heading"><div><div class="eyebrow">Gifthub workspace</div><div class="h1">'+title+'</div><div class="sub">'+sub+'</div></div><div class="actions">'+(action||'')+'</div></div>'}
function table(headers,rows){return '<div class="table-wrap"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'}
function orderRows(data){return data.map(o=>'<tr><td><b>'+o.id+'</b></td><td>'+o.who+'</td><td>'+o.item+'</td><td>'+money(o.amount)+'</td><td>'+status(o.status)+'</td><td>'+o.date+'</td></tr>').join('')}
function renderNav(){const list=menus[role];$("#nav").innerHTML=list.map(([n,i])=>'<button class="'+(page===n?'active':'')+'" data-page="'+n+'"><span class="ico">'+i+'</span>'+n+'</button>').join('');$("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function render(){renderNav();$("#breadcrumb").textContent="Workspace / "+page;$("#tenantLabel").textContent=role==="superadmin"?"All tenants · Platform view":role==="employee"?"Acme Technologies · Employee store":role==="hr"?"Acme Technologies · HR workspace":"Fulfilment centre";$("#userAvatar").textContent=role==="superadmin"?"SA":role==="hr"?"HR":role==="employee"?"PS":"OP";$("#roleSelect").value=role;
let html="";
if(role==="superadmin")html=superView();
if(role==="hr")html=hrView();
if(role==="employee")html=employeeView();
if(role==="ops")html=opsView();
$("#content").innerHTML=html;
$("#content").querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>action(b.dataset.action,b.dataset.id)));
}
function superView(){if(page==="Tenants")return heading("Tenant management","Manage organisations on the Gifthub platform.",'<button class="btn primary" data-action="tenant">＋ Add tenant</button>')+'<div class="card"><div class="section-title">Your tenants</div><div class="section-sub">3 active organisations · 1 invitation pending</div>'+table(["Organisation","Employees","Credits allocated","Status",""],tenants.map((t,i)=>'<tr><td><b>'+t.name+'</b></td><td>'+t.people+'</td><td>'+t.credits+'</td><td>'+status(t.status)+'</td><td><button class="btn small" data-action="tenant-edit" data-id="'+i+'">Manage</button></td></tr>').join(''))+'</div>';
if(page==="Master catalogue")return catalogue(true);
if(page==="All orders"||page==="Procurement")return heading(page,page==="Procurement"?"Track supplier purchasing and stock replenishment.":"Monitor gift orders across every tenant.",'<button class="btn" data-action="export">↓ Export</button>')+'<div class="card"><div class="section-title">'+page+'</div><div class="section-sub">Live demo order data</div>'+table(["Order","Recipient","Gift","Amount","Status","Placed"],orderRows(orders))+'</div>';
if(page==="Reports")return reports("Platform performance");
if(page==="Settings")return settings();
return heading("Good evening, Platform Admin","Here's what's happening across your corporate gifting network.",'<button class="btn" data-action="export">↓ Export report</button><button class="btn primary" data-action="tenant">＋ Onboard tenant</button>')+'<div class="grid stats">'+stat("Active tenants","3","◫","+1 invited this month")+stat("Employees enrolled","1,011","♙","+12.8% vs last month")+stat("Orders this month","284","▤","+18.4% vs last month")+stat("Gift value processed","₹8.6L","₹","+9.2% vs last month")+'</div><div class="grid split"><div class="card"><div class="section-title">Recent platform orders</div><div class="section-sub">Latest activity across all tenants</div>'+table(["Order","Recipient","Gift","Amount","Status"],orders.slice(0,4).map(o=>'<tr><td><b>'+o.id+'</b></td><td>'+o.who+'</td><td>'+o.item+'</td><td>'+money(o.amount)+'</td><td>'+status(o.status)+'</td></tr>').join(''))+'</div><div class="card"><div class="section-title">Tenant distribution</div><div class="section-sub">Employee enrolment by organisation</div>'+tenants.slice(0,3).map((t,i)=>'<div style="margin:16px 0"><div class="row-between"><b style="font-size:12px">'+t.name+'</b><span class="sub">'+t.people+' employees</span></div><div class="progress" style="margin-top:8px"><span style="width:'+([46,24,34][i])+'%"></span></div></div>').join('')+'</div></div>';
}
function hrView(){if(page==="Employees")return heading("Employees","Manage your people and their gifting access.",'<button class="btn" data-action="invite">＋ Invite employee</button><button class="btn primary" data-action="employee">＋ Add employee</button>')+'<div class="card"><div class="section-title">Employee directory</div><div class="section-sub">Acme Technologies · 420 enrolled employees</div>'+table(["Employee","Email","Team","Available credits","Status"],employees.map(e=>'<tr><td><b>'+e.name+'</b></td><td>'+e.email+'</td><td>'+e.team+'</td><td>'+money(e.credits)+'</td><td>'+status(e.status)+'</td></tr>').join(''))+'</div>';
if(page==="Credits & wallets")return heading("Credits & wallets","Allocate gifting credits and review employee balances.",'<button class="btn primary" data-action="allocate">＋ Allocate credits</button>')+'<div class="grid stats">'+stat("Total allocated","₹18.4L","◉","+8.2% this quarter")+stat("Credits redeemed","₹12.7L","✓","69% utilisation")+stat("Available balance","₹5.7L","₹","Across all employees")+stat("Employees with credits","420","♙","100% enrolled")+'</div><div class="card">'+table(["Employee","Team","Current balance",""],employees.map((e,i)=>'<tr><td><b>'+e.name+'</b></td><td>'+e.team+'</td><td>'+money(e.credits)+'</td><td><button class="btn small" data-action="adjust" data-id="'+i+'">Adjust</button></td></tr>').join(''))+'</div>';
if(page==="Gift assortment")return catalogue(false);
if(page==="Orders")return heading("Company orders","Track employee redemptions and fulfilment.",'<button class="btn" data-action="export">↓ Export</button>')+'<div class="card">'+table(["Order","Recipient","Gift","Amount","Status","Placed"],orderRows(orders.filter(o=>o.tenant==="Acme Technologies")))+'</div>';
if(page==="Reports")return reports("Company gifting performance");
if(page==="Company settings")return settings();
return heading("Welcome back, HR Admin","Your gifting programme at a glance.",'<button class="btn primary" data-action="allocate">＋ Allocate credits</button>')+'<div class="grid stats">'+stat("Employees enrolled","420","♙","+12 this month")+stat("Credits allocated","₹18.4L","◉","Across your organisation")+stat("Credits redeemed","₹12.7L","✓","69% utilisation")+stat("Orders this month","126","▤","+14.5% vs last month")+'</div><div class="grid split"><div class="card"><div class="section-title">Recent orders</div><div class="section-sub">Employee gift redemptions</div>'+table(["Order","Employee","Gift","Status"],orders.filter(o=>o.tenant==="Acme Technologies").slice(0,4).map(o=>'<tr><td><b>'+o.id+'</b></td><td>'+o.who+'</td><td>'+o.item+'</td><td>'+status(o.status)+'</td></tr>').join(''))+'</div><div class="card"><div class="section-title">Credit utilisation</div><div class="section-sub">Organisation-wide gifting balance</div><div style="font-size:30px;font-weight:750;margin:12px 0">69%</div><div class="progress"><span style="width:69%"></span></div><div class="row-between" style="margin-top:12px"><span class="sub">Redeemed · ₹12.7L</span><b>₹5.7L left</b></div></div></div>';
}
function catalogue(admin){return heading(admin?"Master catalogue":"Your gift assortment",admin?"Manage products available to all tenants.":"Curated gifts available to Acme employees.",admin?'<button class="btn primary" data-action="product">＋ Add product</button>':'<span class="pill">6 curated gifts</span>')+'<div class="grid product-grid">'+products.map(p=>'<div class="card product"><div class="product-art">'+p.icon+'</div><div class="product-info"><div class="row-between"><span class="pill">'+p.category+'</span><span class="price">'+money(p.price)+'</span></div><div class="product-name" style="margin-top:9px">'+p.name+'</div><div class="product-meta">'+p.desc+'</div>'+(admin?'<button class="btn small" data-action="edit-product" data-id="'+p.id+'">Edit product</button>':'<button class="btn primary small" style="width:100%" data-action="redeem" data-id="'+p.id+'">Redeem gift</button>')+'</div></div>').join('')+'</div>'}
function employeeView(){if(page==="My wallet")return heading("My wallet","Your gifting credits, ready to make someone's day.")+'<div class="grid split"><div class="wallet"><div class="label">Available gifting credits</div><div class="amount">'+money(wallet)+'</div><small>Acme Technologies · Annual gifting wallet</small><br><button class="btn gold" data-action="store">Explore gift store →</button></div><div class="card"><div class="section-title">Your wallet activity</div><div class="section-sub">Recent credit movements</div>'+table(["Activity","Date","Credits"],'<tr><td>Annual credits added</td><td>01 Apr 2026</td><td style="color:var(--green)">+₹5,000</td></tr><tr><td>Commuter Backpack</td><td>04 Oct 2026</td><td>-₹800</td></tr>')+'</div></div>';
if(page==="My orders")return heading("My orders","Keep track of your gifts and deliveries.")+'<div class="card">'+table(["Order","Gift","Amount","Status","Placed"],orders.filter(o=>o.who==="Priya Sharma").concat(orders.slice(0,1)).map(o=>'<tr><td><b>'+o.id+'</b></td><td>'+o.item+'</td><td>'+money(o.amount)+'</td><td>'+status(o.status)+'</td><td>'+o.date+'</td></tr>').join(''))+'</div>';
if(page==="Delivery addresses")return heading("Delivery addresses","Manage where your gifts should arrive.",'<button class="btn primary" data-action="address">＋ Add address</button>')+'<div class="card"><div class="section-title">Saved addresses</div><p class="sub">Home · 14, Park Street, Bengaluru, Karnataka 560001</p><span class="pill">Default address</span></div>';
return heading("Find your next favourite gift","A little something to celebrate you. Choose a gift using your available credits.",'<span class="pill">Wallet balance · '+money(wallet)+'</span>')+catalogue(false).replace(/<div class="heading">[\s\S]*?<\/div>/,"");
}
function opsView(){if(page==="Order queue")return heading("Order queue","Review, process and move orders through fulfilment.",'<button class="btn" data-action="export">↓ Export queue</button>')+'<div class="card">'+table(["Order","Recipient","Tenant","Gift","Amount","Status",""],orders.map(o=>'<tr><td><b>'+o.id+'</b></td><td>'+o.who+'</td><td>'+o.tenant+'</td><td>'+o.item+'</td><td>'+money(o.amount)+'</td><td>'+status(o.status)+'</td><td><button class="btn small" data-action="advance" data-id="'+o.id+'">Advance</button></td></tr>').join(''))+'</div>';
if(page==="Procurement"||page==="Inventory")return heading(page,"Monitor stock and vendor operations across gift categories.",'<button class="btn primary" data-action="procure">＋ Create purchase order</button>')+'<div class="card">'+table(["Product","Category","Available stock","Reorder point","Status"],products.map((p,i)=>'<tr><td><b>'+p.name+'</b></td><td>'+p.category+'</td><td>'+[124,18,73,9,42,56][i]+'</td><td>20</td><td>'+status([124,18,73,9,42,56][i]<20?"Pending":"Active")+'</td></tr>').join(''))+'</div>';
if(page==="Shipping & delivery")return heading("Shipping & delivery","Manage dispatches, tracking and delivery confirmation.")+'<div class="card">'+table(["Order","Recipient","Destination","Tracking","Status"],orders.slice(0,4).map((o,i)=>'<tr><td><b>'+o.id+'</b></td><td>'+o.who+'</td><td>'+["Bengaluru","Noida","Mumbai","Pune"][i]+'</td><td>GHX'+(83021+i)+'</td><td>'+status(o.status)+'</td></tr>').join(''))+'</div>';
return heading("Operations overview","Fulfilment pulse across the Gifthub network.",'<button class="btn" data-action="export">↓ Export</button>')+'<div class="grid stats">'+stat("Orders to process","18","▤","7 awaiting packing")+stat("In transit","42","⌖","On schedule")+stat("Delivered this month","224","✓","+16% vs last month")+stat("Low-stock products","2","▧","Replenishment needed")+'</div><div class="card"><div class="section-title">Priority order queue</div><div class="section-sub">Orders requiring operations attention</div>'+table(["Order","Recipient","Tenant","Gift","Status","Action"],orders.slice(0,4).map(o=>'<tr><td><b>'+o.id+'</b></td><td>'+o.who+'</td><td>'+o.tenant+'</td><td>'+o.item+'</td><td>'+status(o.status)+'</td><td><button class="btn small" data-action="advance" data-id="'+o.id+'">Advance</button></td></tr>').join(''))+'</div>';
}
function reports(title){return heading("Reports & analytics",title+" · Sample data for client walkthrough.",'<button class="btn primary" data-action="export">↓ Download CSV</button>')+'<div class="grid stats">'+stat("Total gift value","₹8.6L","₹","+9.2% month over month")+stat("Orders fulfilled","284","✓","96% fulfilment rate")+stat("Avg. order value","₹1,640","▤","+4.1% this quarter")+stat("Employee engagement","78%","♙","+6 points this quarter")+'</div><div class="grid split"><div class="card"><div class="section-title">Monthly gifting activity</div><div class="section-sub">Order volume · Last six months</div>'+[["Jun",42],["Jul",56],["Aug",48],["Sep",72],["Oct",88],["Nov",64]].map(([m,v])=>'<div class="row-between" style="margin:12px 0"><span style="width:35px;color:var(--muted)">'+m+'</span><div class="progress" style="flex:1"><span style="width:'+v+'%"></span></div><b style="width:30px;text-align:right">'+v+'</b></div>').join('')+'</div><div class="card"><div class="section-title">Popular gift categories</div><div class="section-sub">Share of redeemed gifts</div>'+[["Lifestyle",32],["Tech",27],["Apparel",21],["Office",20]].map(([m,v])=>'<div style="margin:14px 0"><div class="row-between"><span>'+m+'</span><b>'+v+'%</b></div><div class="progress" style="margin-top:7px"><span style="width:'+v+'%"></span></div></div>').join('')+'</div></div>'}
function settings(){return heading("Workspace settings","Configure your organisation's gifting experience.")+'<div class="card" style="max-width:700px"><div class="section-title">Organisation profile</div><div class="field"><label>Organisation name</label><input value="'+(role==="superadmin"?"Gifthub Platform":"Acme Technologies")+'"></div><div class="field"><label>Primary contact</label><input value="people@acme.io"></div><div class="field"><label>Default currency</label><select><option>INR · Indian Rupee</option></select></div><button class="btn primary" data-action="save-settings">Save changes</button></div>'}
function openModal(title,desc,fields,callback){$("#modalTitle").textContent=title;$("#modalDesc").textContent=desc;$("#modalFields").innerHTML=fields;$("#modalBack").classList.add("open");$("#modalSave").onclick=()=>{callback();$("#modalBack").classList.remove("open")}}
function action(a,id){if(a==="store"){role="employee";page="Gift store";render();return}
if(a==="redeem"){const p=products.find(x=>x.id===+id);if(p.price>wallet){toast("Not enough credits for this gift.");return}openModal("Confirm gift redemption","Redeem "+p.name+" for "+money(p.price)+"?",'<div class="field"><label>Delivery address</label><select><option>Home · Bengaluru</option><option>Office · Bengaluru</option></select></div>',()=>{wallet-=p.price;orders.unshift({id:"GH-"+(2050+orders.length),who:"Priya Sharma",tenant:"Acme Technologies",item:p.name,amount:p.price,status:"Pending",date:"04 Nov 2026"});render();toast("Gift redeemed successfully. Order placed!")});return}
if(a==="tenant")openModal("Onboard a tenant","Create a new corporate gifting workspace.",'<div class="field"><label>Company name</label><input id="f1" placeholder="e.g. Contoso Ltd"></div><div class="field"><label>Admin email</label><input id="f2" placeholder="hr@company.com"></div><div class="field"><label>Initial credit pool (₹)</label><input id="f3" type="number" placeholder="100000"></div>',()=>{const n=$("#f1").value.trim();if(!n){toast("Enter a company name.");return}tenants.push({name:n,people:0,credits:money($("#f3").value||0),status:"Invited"});render();toast("Tenant invitation created.")});
if(a==="employee"||a==="invite")openModal(a==="invite"?"Invite employee":"Add employee","Add a person to the company gifting programme.",'<div class="field"><label>Full name</label><input id="f1" placeholder="Employee name"></div><div class="field"><label>Work email</label><input id="f2" placeholder="name@company.com"></div><div class="field"><label>Team</label><input id="f3" placeholder="Department"></div>',()=>{const n=$("#f1").value.trim();if(!n){toast("Enter an employee name.");return}employees.push({name:n,email:$("#f2").value,team:$("#f3").value,credits:0,status:"Active"});render();toast("Employee added to the directory.")});
if(a==="allocate"||a==="adjust"){openModal(a==="allocate"?"Allocate gifting credits":"Adjust employee wallet","Credits are simulated for this client demo.",'<div class="field"><label>Employee</label><select id="f1">'+employees.map((e,i)=>'<option value="'+i+'">'+e.name+'</option>').join('')+'</select></div><div class="field"><label>Credit amount (₹)</label><input id="f2" type="number" placeholder="2500"></div>',()=>{const e=employees[+$("#f1").value];e.credits+=Number($("#f2").value||0);render();toast("Wallet balance updated.")});return}
if(a==="product"||a==="edit-product")openModal("Add catalogue product","Product changes are local to this demo.",'<div class="field"><label>Product name</label><input id="f1" placeholder="Product name"></div><div class="field"><label>Price (₹)</label><input id="f2" type="number" placeholder="999"></div>',()=>{if($("#f1").value.trim())products.push({id:Date.now(),name:$("#f1").value,category:"New",price:Number($("#f2").value||999),icon:"✦",desc:"New catalogue item"});render();toast("Catalogue updated.")});
if(a==="advance"){const o=orders.find(x=>x.id===id);if(o){o.status=o.status==="Pending"?"Processing":o.status==="Processing"?"Shipped":o.status==="Shipped"?"Delivered":"Delivered";render();toast("Order status updated to "+o.status)}return}
if(a==="address")openModal("Add delivery address","Save a delivery destination for future gifts.",'<div class="field"><label>Address label</label><input id="f1" placeholder="Home / Office"></div><div class="field"><label>Full address</label><input id="f2" placeholder="Street, city, PIN"></div>',()=>toast("Address saved in this demo."));
if(a==="procure")openModal("Create purchase order","Create a sample procurement request.",'<div class="field"><label>Product</label><select>'+products.map(p=>'<option>'+p.name+'</option>').join('')+'</select></div><div class="field"><label>Quantity</label><input type="number" value="50"></div>',()=>toast("Purchase order drafted."));
if(a==="save-settings")toast("Settings saved.");
if(a==="export"){const csv="Order,Recipient,Tenant,Gift,Amount,Status,Date\n"+orders.map(o=>[o.id,o.who,o.tenant,o.item,o.amount,o.status,o.date].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");const blob=new Blob([csv],{type:"text/csv"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="gifthub-demo-report.csv";link.click();URL.revokeObjectURL(url);toast("CSV report downloaded.")}
}
$("#roleSelect").addEventListener("change",e=>{role=e.target.value;page=menus[role][0][0];render();$("#sidebar").classList.remove("open")});
$("#modalClose").onclick=$("#modalCancel").onclick=()=>$("#modalBack").classList.remove("open");
$("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("open");
render();
})();
</script>
</body></html>
